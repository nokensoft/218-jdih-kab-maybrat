<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - JDIH Kabupaten Maybrat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- ============ CONTAINER CARD LOGIN ============ -->
  <div class="w-full max-w-md bg-white border border-line rounded-2xl shadow-sm p-8 sm:p-10">
    
    <!-- Header Form -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-forest-100 border border-line mb-4 group hover:scale-105 transition-transform">
        <img src="./img/logo.webp" alt="Logo JDIH Maybrat" class="w-full h-full object-cover rounded-full">
      </a>
      <h1 class="font-display text-2xl font-bold text-forest-800">Masuk Administrator</h1>
      <p class="text-xs text-muted mt-1.5">Portal Kelola Dokumen Hukum JDIH Kabupaten Maybrat</p>
    </div>

    <!-- Form Login -->
    <form x-data="{ showPassword: false }" @submit.prevent="console.log('Login submitted')" class="space-y-5">
      
      <!-- Field Username -->
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-forest-800 mb-2">Username / NIP</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-muted pointer-events-none">
            <i class="fa-regular fa-user text-sm"></i>
          </span>
          <input type="text" id="username" value="admin123" name="username" required placeholder="Masukkan username" 
            class="w-full pl-10 pr-4 py-2.5 bg-paper border border-line rounded-lg text-sm text-ink placeholder:text-muted/60 focus:outline-none focus:border-forest-700 focus:ring-1 focus:ring-forest-700 transition-colors">
        </div>
      </div>

      <!-- Field Password -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-forest-800">Password</label>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-muted pointer-events-none">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input :type="showPassword ? 'text' : 'password'" id="password" value="12345678" name="password" required placeholder="••••••••" 
            class="w-full pl-10 pr-10 py-2.5 bg-paper border border-line rounded-lg text-sm text-ink placeholder:text-muted/60 focus:outline-none focus:border-forest-700 focus:ring-1 focus:ring-forest-700 transition-colors">
          <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-muted hover:text-forest-800 transition-colors">
            <i class="fa-regular text-sm" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <a href="dashboard.html" class="w-full py-3 px-4 bg-forest-700 hover:bg-forest-800 text-paper font-medium rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center gap-2">
        <span>Masuk ke Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>

    </form>

    <!-- Footer Form -->
    <div class="mt-8 pt-6 border-t border-line text-center">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-muted hover:text-forest-700 transition-colors">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        Kembali ke Beranda Utama
      </a>
    </div>

  </div>


</body>
</html>
